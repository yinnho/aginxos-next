[workspace]
resolver = "2"
members = ["crates/carrier", "crates/types", "crates/memory", "crates/clone", "crates/dup", "crates/gateway", "crates/lifecycle", "crates/runtime", "crates/kernel", "crates/ilink", "crates/webhook", "crates/web", "crates/agf", "crates/agmem"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/yinnho/aginx-carrier"
rust-version = "1.75"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Error handling
thiserror = "2"
anyhow = "1"

# Logging / Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI
clap = { version = "4", features = ["derive"] }

# Time
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
sha1 = "0.10"
# IDs
uuid = { version = "1", features = ["v4", "v5", "serde"] }
async-trait = "0.1"
dirs = "6"
# Security
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
ed25519-dalek = { version = "2", features = ["rand_core"] }
# Testing
rmp-serde = "1"

# Internal crates
carrier-types = { path = "crates/types" }

rusqlite = { version = "0.31", features = ["bundled", "serde_json"] }
regex = "1"
lazy_static = "1.4"
dashmap = "6"
tempfile = "3"

carrier-memory = { path = "crates/memory" }

reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "gzip", "deflate", "brotli", "blocking", "multipart", "cookies"] }
base64 = "0.22"
urlencoding = "2"
flate2 = "1"
tar = "0.4"

carrier-clone = { path = "crates/clone" }
carrier-gateway = { path = "crates/gateway" }
carrier-lifecycle = { path = "crates/lifecycle" }
libc = "0.2"
once_cell = "1"
futures = "0.3"
bytes = "1"
wasmtime = "47"
hmac = "0.12"
zeroize = { version = "1", features = ["derive"] }
regex-lite = "0.1"
libloading = "0.8"
shlex = "1"

carrier-runtime = { path = "crates/runtime" }
carrier-kernel = { path = "crates/kernel" }
carrier-ilink = { path = "crates/ilink" }
carrier-webhook = { path = "crates/webhook" }
# agent:// 客户端所在 crate（经网关路由外部 CLI 工具），版本对齐 agc
tokio-rustls = "0.26"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pki-types = "1"
webpki-roots = "1"

# Webhook inbound channel HTTP server (first server-side HTTP surface)
axum = "0.8"

carrier = { path = "crates/carrier" }

# ilink channel deps
md-5 = "0.10"


# ilink channel deps
roxmltree = "0.20"


# ilink channel deps
aes = "0.8"


# ilink channel deps
cbc = "0.1"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3
