[package]
name = "aginx-web"
# D13 改名（2026-09-09）：原 agb v0.2.0 → aginx-web v0.3.0。包名/二进制名/
# clap 名同步换，行为零变化；设备侧经 aginx-pkg 换装（manifest 行随迁）。
# 2026-09-24 结构刀①：版本并入 workspace 统一 0.1.0。
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "aginx-web — browser/search/fetch 工具 CLI（原 agb，M31 D3 批1 外置成包）"

# aginx-web（原 agb，M31 D3 批1）— browser_* / web_search / web_fetch 三组
# 无状态 HTTP 工具的实现从 carrier-runtime 搬出的单真源：runtime 只留薄桥
#（同名 ToolDefinition + spawn `aginx-web tool <name>`），本 CLI 既有给人/
# 流程脚本用的子命令面，也有 `tool <name>` 机读面（stdin JSON → D1 信封）。
# 引擎层（SSRF/taint/风控路由/HTML→Markdown）随代码整体搬家。
[[bin]]
name = "aginx-web"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
anyhow.workspace = true
carrier-types.workspace = true
clap.workspace = true
libc.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
dashmap.workspace = true
hex.workspace = true
tokio.workspace = true
tracing.workspace = true
