[package]
name = "aginx-secret"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# aginx-secret (M36 agsecret, N5② 吸收改姓) — the secret sidecar. One
# local daemon (aginx-secretd) holds every boundary credential; CLI faces
# and future daemons (aginx-gateway) ask over a unix socket instead of
# inheriting env files. Scope-level allowlist by peer exe
# (/etc/aginx/secret.policy, tracked, secret-free), HMAC signing so
# relay/api chains never export key material. Not a defense against
# hostile local root (single-user phone — impossible by construction);
# a defense against ambient leakage: env inheritance, argv,
# transcripts, backup tars.
[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
libc = { workspace = true }
sha2 = "0.10"
hmac = "0.12"
agio = { path = "../agio" }

[dev-dependencies]
testkit = { path = "../testkit" }

[[bin]]
name = "aginx-secretd"
path = "src/bin/aginx-secretd.rs"

[[bin]]
name = "aginx-secret"
path = "src/bin/aginx-secret.rs"
