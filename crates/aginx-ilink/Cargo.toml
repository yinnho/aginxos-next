# aginx-ilink — weixin 频道守护（#68 ②b 第一频道，2026-10-01）。
# 会话家 /home/channels/weixin/（绑定=字段，DESIGN.md §四）；协议腿复用
# carrier-ilink；对引擎只说 ACP 窄接口（本地口 127.0.0.1:8686，
# aginx-gateway-local 供的 gateway 名册）——频道不感知引擎，引擎随
# 名册条目换。
[package]
name = "aginx-ilink"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
anyhow = "1"
carrier-ilink = { path = "../ilink" }
carrier-types = { path = "../types" }
qrcodegen = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
