[package]
name = "aginx-term"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
libc = { workspace = true }
vte = "0.13"
# M38a: CJK glyph rasterization (Noto Sans Mono CJK subset in the rootfs,
# /usr/share/fonts/agterm-cjk.otf). Pure Rust, zero C deps — musl-static
# friendly. ASCII stays on the 5x8 bitmap; this is the wide-glyph path.
ab_glyph = "0.2"
# M39: JPEG decode for the photo viewer — vendored libjpeg-turbo with NEON
# (SM7250 has no JPEG decode hardware; this is the normal-phone path).
aginx-img = { path = "../img" }
# M16: the launcher's app registry (/var/apps scan + app.toml schema)
# lives in the aginx-svc crate (N4③b ../svc) so the format has one definition.
aginx-svc = { path = "../svc" }
# M42a: the voice dialog face — aginx-voice (the daemon) is the sole writer of
# /run/aginx-voice/face; aginx-term parses the JSON to render it. Display-only: the
# screen has no touch targets in that mode beyond the BACK affordance.
serde = { workspace = true }
serde_json = { workspace = true }
# D14: 机型事实（面板尺寸/输入节点/分核）唯一合法来源 devices/<codename>/
# device.toml——voice 同款读法层（../hwd，纯 lib，host 测试可 from_path）。
hwd = { path = "../hwd" }
# C6: 扫码配网——QR payload 分诊（parse_pair_payload/parse_wifi_payload 纯
# 解析）。feature 纪律同 voice：绝不选 jpeg（quircs/aginx-img 不进 term）。
aginx-qr = { path = "../qr", default-features = false }
