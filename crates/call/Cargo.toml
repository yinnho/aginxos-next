# aginx-call — SIP 实时通话 CLI（M48 刀5a 入树，2026-09-28）。
# spike 血统：out/sip-spike/aginx-call（刀1–刀3 收据件）原样搬家；
# rvoip-sip 走 crates.io 钉 0.3.10（vendor 已核实零补丁原版，crates.io
# 同版可直接换源）。opus-media 折 audiopus_sys（CMake 交叉配方在
# scripts/build-pkg.sh 的 aginx-call 案）。
[package]
name = "aginx-call"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
anyhow = "1"
rvoip-sip = "=0.3.10"
tokio = { version = "1", features = ["full"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(target_os = "macos")'.dependencies]
cpal = "0.15"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[features]
default = []
opus-media = ["rvoip-sip/opus"]
