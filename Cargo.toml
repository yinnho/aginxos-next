[workspace]
resolver = "2"
members = [
    "crates/agi",
    "crates/agio",
    "crates/qr",
    "crates/sign",
    "crates/download",
    "crates/update",
    "crates/router",
    "crates/runtime",
    "crates/server",
    "crates/voice",
    "crates/wizard",
    "crates/svc",
    "crates/img",
    "crates/term",
    "crates/pkg",
    "crates/testkit",
    "crates/done",
    "crates/secret",
    "crates/gateway",
    "crates/pair",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/yinnho/aginxos"
authors = ["yinnho"]

[workspace.dependencies]
libc = "0.2"
anyhow = "1"
async-trait = "0.1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

[profile.release]
lto = true
strip = true
