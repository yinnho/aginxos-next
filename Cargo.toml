[workspace]
resolver = "2"
members = [
    "crates/agi",
    "crates/agio",
    "crates/router",
    "crates/runtime",
    "crates/server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/yinnho/aginxos"
authors = ["yinnho"]

[workspace.dependencies]
libc = "0.2"
anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

[profile.release]
lto = true
strip = true
