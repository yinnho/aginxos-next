# aginx-ilink — weixin 频道包（#68 ②b 第一频道，2026-10-01）。
# DESIGN.md §四：一频���=一目录+一包——本包是协议腿（守护+CLI），
# 数据与绑定全在 /home/channels/weixin/（channel.toml + senders/，
# 绑定=记录字段，换绑=改字段不搬家）；频道不感知引擎：桥只说 ACP
# 窄接口（「把文本交给某 agent，拿回文本」），对端=本机
# aginx-gateway-local（127.0.0.1:8686），引擎随 gateway 名册条目换。
# 启动序（daemon.rs）：legacy 会话一次性迁移 → set_sessions_root →
# SessionWatcher（5s respawn 拾新扫码/换绑）→ 桥（每发信人串行）。
# 依赖序：depends=aginx-gateway-local 只保安装序，启动序由
# requires_weak 延到本机口 ready（8686 没起=每回合如实回信报错，
# 不殉频道守护——扫上来的消息等口回来）。
# 母体（aginx-server）与此包互不相见：母体的 weixin watcher 只扫
# workflows/*/senders/ 旧布局（②b 后该处无 weixin 会话=天然停摆），
# 正式清场归 #68 刀④。
name = "aginx-ilink"
version = "0.1.0"
summary = "weixin 频道守护：扫码起号/换绑 CLI + ACP 桥（会话家 channels/weixin，绑定=字段）"
group = "net"
depends = "aginx-gateway-local"
url = "https://pkgs.aginx.net/aginx-ilink/v0.1.0/aginx-ilink-v0.1.0-4pc.tar"

[service]
cmd = "/var/bin/aginx-ilink"
args = ["daemon"]
type = "simple"
envs = ["AGINX_HOME=/home", "TZ=CST-8"]
requires_weak = ["aginx-gateway-local"]
