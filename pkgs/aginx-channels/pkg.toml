# aginx-channels — 频道体系包（#69 改形，2026-10-02）。
# crates/channels 唯一家：全部频道的机身（守护+CLI 一件双面），
# weixin 是第一腿不是包名；新频道=crate 新模块，面不变。
# DESIGN.md §四：一频道=一目录（/home/channels/<名>/channel.toml +
# senders/，绑定=记录字段，换绑=改字段不搬家）；频道不感知引擎：
# 桥只说 ACP 窄接口（「把文本交给某 agent，拿回文本」），对端=本机
# aginx-gateway-local（127.0.0.1:8686），引擎随 gateway 名册条目换。
# 子命令带频道名（login weixin / send weixin <uid> <text>）。
# v0.1.7（2026-10-25 桥 authToken 腿）：ACP initialize 带
# _meta.authToken（env AGINX_CHANNELS_ACP_TOKEN 读，主仓 8e97ae21）
# ——对端 gateway-local 配 [[local_clients]]（token→principal
# svc:weixin-bridge）后桥获真实身份非 anon，名册 [access] 按
# principal 放行。单元补 env_file=/etc/aginx/env：token 真源在
# 设备侧 env（装包不冲掉，/etc 是真源）。redfin 自 dev-push 线
# 本版转正入 pkg 管理（首装，单元同批翻新）。
# v0.1.8（2026-10-27 入站文件落盘）：iLink 协议腿本来就拉文件本体
# （channel.rs ITEM_TYPE_FILE：CDN+AES，5528B/200ms 活体收据），v0.1
# 的桥把 data 字节扔了只给分身一句免责——人发文件到分身全断。桥
# 补落盘：{AGINX_HOME}/files/<净化名>（basename 化防路径逃逸，同名
# 覆写 new-wins），分身收到「已存 <路径>」继续干活。图片/语音本体
# 仍弃（后续刀）。
# 启动序（daemon.rs）：legacy 会话一次性迁移 → set_sessions_root →
# SessionWatcher（5s respawn 拾新扫码/换绑）→ 桥（每发信人串行）。
# 依赖序：depends=aginx-gateway-local 只保安装序，启动序由
# requires_weak 延到本机口 ready（8686 没起=每回合如实回信报错，
# 不殉频道守护——扫上来的消息等口回来）。
# 母体（aginx-server）与此包互不相见：母体的微信接线已随 #69 本刀
# 退役（server boot 与 carrier wiring 两处均无通道管理器）。
name = "aginx-channels"
version = "0.1.8"
summary = "频道体系守护+CLI（weixin 第一腿）：login/bind/send（含 CDN 图/视/文件），ACP 桥+媒体回信；bound_only 只收绑定号本人"
group = "net"
depends = "aginx-gateway-local"
url = "https://pkgs.aginx.net/aginx-channels/v0.1.8/aginx-channels-v0.1.8-4pc.tar"

[service]
cmd = "/var/bin/aginx-channels"
args = ["daemon"]
type = "simple"
envs = ["AGINX_HOME=/home", "TZ=CST-8"]
env_file = "/etc/aginx/env"
requires_weak = ["aginx-gateway-local"]
