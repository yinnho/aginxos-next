# aginx-gateway-local — 本机 ACP 口的包形态（#68 ②b，2026-10-01）。
# 真aginx（aginx-gateway 包）在 relay 模式下**无本地监听**（只有出站
# RelayClient）——频道桥要的「把文本交给某 agent」窄接口没有对端。
# 本包=同真身的第二个实例：direct 模式只听 127.0.0.1:8686。
# 为何独立数据世界：sessions.json/spool/auth.json 是整文件写，两守护
# 共一个 AGINX_DATA_DIR 会互相覆盖——故 /var/lib/aginx/gateway-local
# 分家，**agents 符号链回 ../gateway/agents**：名册（条目=谁能被
# 寻址）仍是单一寻址点，channel 桥换引擎=改名册条目，与 relay 腿
# 同册不同世界。
# access="public" 仅回环可及（127.0.0.1 绑定即门），ACP 无 authToken
# 腿。配置：包内 etc/gateway-local.toml 是出厂缺省，壳首启拷
# /etc/aginx/gateway-local.toml（已存在不覆写——/etc 是真源）。
name = "aginx-gateway-local"
version = "0.1.0"
summary = "本机 ACP 口：真aginx direct 127.0.0.1:8686（频道桥窄接口对端；名册链回主 gateway）"
group = "net"
depends = "aginx-gateway"
url = "https://pkgs.aginx.net/aginx-gateway-local/v0.1.0/aginx-gateway-local-v0.1.0-4pc.tar"

[service]
cmd = "/var/bin/aginx-gateway-local"
args = []
type = "simple"
envs = ["AGINX_DATA_DIR=/var/lib/aginx/gateway-local"]
requires_weak = ["aginx-gateway"]
