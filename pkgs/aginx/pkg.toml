# aginx — 母体包（D11 母体=aginx）。刀2 起 server 进程内直调 kernel，
# 不再 spawn aginx-runtime（该二进制已随结构刀①物理删除）。
# v0.1.2（2026-09-25）：母体刀5 裁剪车——wasmtime 裁到
# cranelift+runtime+std（server musl 22.48M→19.65M，Cargo.lock -442 行）；
# wat 只进 test 构建。v0.1.1（2026-09-24）：结构四刀后重出——workspace
# 合一引擎入 server、host.rs 内嵌种子退役（出厂树走镜像 home/ 整树，包
# 不再种）；设备快验收据见 docs/HARDWARE.md 当日条。v0.1.0/v0.1.1 镜像
# 件保留不动（在役 manifest 钉 sha）。
# tree 包：/var/bin/aginx 是指进 pkgfiles 的 symlink（exec=bin/aginx）；
# server 真身由单元直接指 pkgfiles 路径 spawn——/proc/exe 解析到真身，
# secret.policy brain.primary 已加该路径（必修①，不补=绿灯无脑）。
# 单元名=包名 aginx（write_unit 按安装名落）：aginx-svc status aginx、
# 日志 aginx.log。AGINX_HOME=/home（FS.md；旧 /home/.aginx 不再是家）。
# AGINX_BIN 指 /var/bin/aginx（face symlink）。刀F 起 depends 锚
# aginx-update（装母体自动带自更新器；裸箱升级=重刷）。
name = "aginx"
version = "0.1.3"
summary = "母体：路由器 face /var/bin/aginx + 心脏 server（进程内直调 kernel）"
group = "agent"
depends = "aginx-update"
url = "https://pkgs.aginx.net/aginx/v0.1.3/aginx-v0.1.3-4pc.tar"
exec = "bin/aginx"

[service]
cmd = "/var/lib/aginx/pkgfiles/aginx/bin/aginx-server"
args = []
type = "simple"
envs = ["AGINX_HOME=/home", "AGINX_BIN=/var/bin/aginx"]
env_file = "/etc/aginx/env"
