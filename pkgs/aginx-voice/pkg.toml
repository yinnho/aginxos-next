# aginx-voice — 语音对话守护的包形态（C8 蛋案 → L0 刀3：单元入包）。
# 嘴耳三件是硬依赖：缺 aginx-asr/tts/ocr 时落 brain 云（离线即产品，
# 所以 depends 声明全三——刀1 起 opt-in 自动带装）。
# VOICED_FRONT 指 /var/bin/aginx（母体包 face）：L0 镜像不烤路由器，
# 自由文本走包面。env_file 与 server 同读（brain key）。
name = "aginx-voice"
version = "0.2.1"
summary = "语音对话守护：PTT 嘴耳 + 眼取景，脸写 /run/aginx-voice/face"
group = "snd"
depends = "aginx-asr,aginx-tts,aginx-ocr"
url = "https://pkgs.aginx.net/aginx-voice/v0.2.1/aginx-voice-v0.2.1-4pc.tar"

[service]
cmd = "/var/bin/aginx-voice"
args = []
type = "simple"
envs = ["VOICED_FRONT=/var/bin/aginx"]
env_file = "/etc/aginx/env"
