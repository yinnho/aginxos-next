# aginx-voice — SIP 嘴耳内件的包形态（C8 蛋案 → L0 刀3：单元入包）。
# #422 / Positioning（2026-10-01）：不再是人机 PTT/上脸产品面；资产归
# SIP 线内部机械（agent 通话时的嘴与耳）。硬依赖只留嘴耳两件：
#   depends = aginx-asr,aginx-tts
# 冻结脸线（ocr 眼 / qr·pair 扫码配网）**不再**随 voice 自动带装——
# 需要时单独 opt-in；缺件时相关 spawn 失败，不影响 SIP 嘴耳主路径。
# aginx-call 仍不进 depends（19M 大件，通话另 opt-in）。
# VOICED_FRONT 指 /var/bin/aginx；env_file 与 server 同读（brain key）。
name = "aginx-voice"
version = "0.2.2"
summary = "SIP 嘴耳内件：本地 ASR/TTS 腿（人机 PTT/上脸已停投，#422）"
group = "snd"
depends = "aginx-asr,aginx-tts"
url = "https://pkgs.aginx.net/aginx-voice/v0.2.2/aginx-voice-v0.2.2-4pc.tar"

[service]
cmd = "/var/bin/aginx-voice"
args = []
type = "simple"
envs = ["VOICED_FRONT=/var/bin/aginx"]
env_file = "/etc/aginx/env"
