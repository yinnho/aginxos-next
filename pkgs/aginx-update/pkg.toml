# aginx-update — 自更新器的包形态（刀F，2026-09-12：出镜像走包）。
# 母体包 depends 锚住（装 aginx 自动带）；裸箱升级=fastboot 重刷
# （未 opt-in 无 apply 面）。BOOT_OK_BIN=/usr/bin/aginx-boot-ok 与
# DOWNLOAD_BIN=/usr/bin/aginx-download 都是 L0 直装件——包体零改。
# hwd 消费者：device.toml 加键=重打本包。
name = "aginx-update"
version = "0.1.0"
summary = "A/B 自更新：capture/state tar/status/apply（face /var/bin/aginx-update）"
group = "sys"
url = "https://pkgs.aginx.net/aginx-update/v0.1.0/aginx-update-v0.1.0-4pc.tar"

exec = "bin/aginx-update"
