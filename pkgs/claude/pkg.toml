# claude — Claude Code 引擎 CLI（上游裸原生件树包，git/jq 同族工艺）。
# 官方 @anthropic-ai/claude-code-linux-arm64-musl 平台子包：Bun 编译
# 单文件原生二进制（自带 JS runtime，不需要 Node），musl arm64 动态链
# ——interpreter /lib/ld-musl-aarch64.so.1，与设备世界同 loader（wrapper
# 自链先到先得，与 git/jq/python3 同 musl 1.2.5 互不回抢）。
