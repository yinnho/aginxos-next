# （[command.env] HOME 腿），不注册 aginx 命令面。
# brain 腿=ANTHROPIC_BASE_URL https://brain.aginx.net/anthropic（brain
# 网关的 Anthropic 格式面；key 走 env，不进包）。
# face /var/bin/claude。
name = "claude"
