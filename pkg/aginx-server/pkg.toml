name = "aginx-server"
version = "0.1.0"
desc = "平台心脏：aginx-server ��台（D10 光标/D8 账本）+ aginx 路由器 + aginx-runtime 引擎，N3 并存包"
exec = "aginx-server"

[service]
cmd = "/var/bin/aginx-server"
type = "simple"
envs = ["AGINX_HOME=/home/.aginx-n", "AGINX_BIN=/var/lib/agpkg/pkgfiles/aginx-server/aginx", "AGINX_RUNTIME_BIN=/var/lib/agpkg/pkgfiles/aginx-server/aginx-runtime", "AGINX_CMD_PATH=/var/lib/agpkg/pkgfiles/aginx-server/tools"]
env_file = "/etc/aginx/env"
