# aginx-secretd (M36 agsecretd, N4③b 改姓) — the secret sidecar: every
# boundary credential in one daemon, served over /run/aginx/secret.sock
# (SO_PEERCRED + exe allowlist in /etc/aginx/secret.policy). DECISIONS
# §9. It speaks no notify protocol and serves a socket, not a
# supervisor channel — type = simple. Daemon home is /usr/libexec/aginx/
# (out of the command universe); the admin face /usr/bin/aginx-secret
# carries the policy's admin allowlist entry.
[unit]
name = aginx-secretd

[service]
cmd = /usr/libexec/aginx/aginx-secretd
args = []
type = simple
