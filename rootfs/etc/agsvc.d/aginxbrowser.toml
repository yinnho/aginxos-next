# aginxbrowser (M9) — local browser engine, HTTP API on :8089. Required
# tier, but the phone stays fully usable without it: absent is a state,
# not an error, and agsvc re-checks every 30 s so provisioning lands it
# without a reboot.
[unit]
name = aginxbrowser

[service]
cmd = /var/bin/aginxbrowser
type = simple
