# redfin 裸件机器事实（S0-1）。绝不进 device.toml——hwd 消费者
# deny_unknown_fields 旧二进制会硬退（hwd 一代差铁律）。
# 本档由 build.rs 手写解析（支持 0x 十六进制直写，非严格 TOML），
# 产出 facts.rs 常量。真源裁决：机器事实只住 devices/<codename>/。

# ABL 跳转契约（abl_a.img Ghidra 逆向收据，见 boot-pi.S 头注）：
# 镜像落点 0xA7E80000、入口=镜像+0 → 代码起 0xA7E80040（rust.ld 同值）。
load_base = 0xA7E80000

[mmio]
hci = 0x01D84000          # UFSHCI 寄存器（u3 起实证）
utrd = 0xB0000000         # UTRDL 槽 0
ucd = 0xB0001000          # UCD（cmd 0x200 | resp 0x200 | PRDT +0x400）
data = 0xB0002000         # 读缓冲（GPT 头 / 日志环逐块扫描）
array = 0xB0003000        # 读② 条目数组缓冲（≤1 块，u4h 起）
staging = 0xB0004000      # 写源缓冲（u5a 起实证；日志环记录组包）
stack_top = 0xB0008000    # 栈顶向下 16KB（不碰 0xB0005000 以下 UFS scratch）
ps_hold = 0x0C264000      # PS_HOLD 复位门（写 0 冷重启）
# S0-6 副核面（PSCI CPU_ON）：mailbox 槽 32B×7 @ 0xB0010000、
# 副核栈 4KB×7 @ 0xB0011000——都在 NC DMA 窗 [0xB0000000,0xB0200000)
# 内：主核 NC 映射读写 ↔ 副核 MMU-off 物理访问（Device 直达），
# 两侧皆非缓存，天然一致，主核收割免维护。
sec_mailbox = 0xB0010000
sec_stack = 0xB0011000

[time]
freq_fallback = 19200000  # CNTFRQ 读 0 时的兜底 Hz

[gic]
# GICv3 基址（真源=活内核 boot DT /sys/firmware/devicetree/base/soc/
# interrupt-controller@17a00000/reg：GICD 0x17A00000+0x10000、
# GICR 0x17A60000+0x100000×8帧；stride=0x20000）。
# 【错档教训】vendor 树 bengal.dtsi 写 0x0F200000/0x0F300000——那是
# bengal 名下另一变体的布局，redfin 实跑 DT 不认：0x0F2 区读回恒 0、
# 0x0F3 区总线停摆（S0-5 前两刷挂死根因）。机器地址一律以活内核
# boot DT 为准，dtsi 只当线索。
# INTID=19：虚拟定时器 PPI3（活内核 /proc/interrupts arch_timer =
# GICv3 19 Level 定谳；PPI 排布非上游 13/14/11/10，勿按惯例写）。
gicd = 0x17A00000
gicr = 0x17A60000
rd_stride = 0x20000       # redistributor-stride（活 DT 同值）
rd_count = 8              # 0x100000/0x20000 = 8 核 8 帧
timer_intid = 19          # CNTVIRQ 的 GIC INTID（16+PPI3）

[spmi]
# SPMI PMIC arbiter v5 五区窗（真源=活内核 DT qcom,spmi@c440000 reg +
# TRUTH.md §2 B 系上机实测；ee=0/APPS、channel=0）。第四区 intr
# （0x0E700000）中断面 S1 不用不列。
core = 0x0C440000         # VERSION@0x0 FEATURES@0x4 APID 表@0x900+4N
chnls = 0x0C600000        # 写通道窗 0x10000×APID
obsrvr = 0x0E600000       # 读观察窗 0x80×APID（ee=0 无附加项）
cnfg = 0x0C40A000         # owner 表@0x700+4N（val&7=write EE）
# 电量链 PPID（battery-truth.md「电量链 PPID 全表」）。flat 地址高字节=外设号
# （DT 中断说明符 <sid2 外设N> 实锤，S1-2b 立律）：CHGR@0x1000=0x210、
# USBIN@0x1300=0x213、TYPEC@0x1500=0x215、MISC@0x1600=0x216。
ppid_chgr = 0x210         # 充电器（0x1006 状态/0x1042 使能）
ppid_usbin = 0x213        # USB 输入（0x1310 PLUGIN/0x1340 SUSPEND）
ppid_typec = 0x215        # Type-C 状态机（0x150B CC_ATTACHED/0x1544 MODE_CFG）
ppid_misc = 0x216         # 看门狗 BARK_BITE 0x1643 所在（ka v3 喂狗正身）
ppid_qg = 0x248           # QG 电量计（LAST_ADC_V @+0xC0、MSOC @+0xBF；s15 已收）
ppid_qgsdam = 0x2B1       # QG SDAM 学习账本（VALID 0x46/SOC 0x47/MAGIC 0x80；s15 已收）
ppid_vadc = 0x231         # VADC 温控/电压 ADC（外设 0x3100，spmi-adc5；s16 主角）

[usb]
# S3 USB 面（S3-USB.md 案头账；真源=本地 redbull 内核树 lito-usb.dtsi +
# dwc3-msm.c + gcc-lito.c + lito-gdsc.dtsi + clk-rcg2.c）。首 1GB Device
# 直映射已覆盖全部 USB MMIO（L1 项 0），无需扩页表。键带 usb_ 前缀
# （build.rs 不加 section 名）。
usb_dwc3 = 0x0A600000     # dwc3 core（QSCRATCH=dwc3+0xF8800；core 0xc1xx/dcfg 0xc7xx）
usb_hsphy = 0x088E3000    # QUSB2 femto HS PHY（十四步上电序在 S3-USB.md）
usb_gcc = 0x00100000      # GCC 基址（USB30 BCR 0xf000/QUSB2 BCR 0x12000/CBCR 0xf0xx/GPLL0 LUCID MODE@+0 STATUS@+0x30）
usb_gdsc = 0x10F004       # usb30_prim GDSC（bit0 SW_COLLAPSE←0 开、poll bit31 PWR_ON）
usb_evbuf = 0xB0005000    # dwc3 事件缓冲 4KB（NC DMA 窗空闲槽：staging 0xB0004000 与栈 0xB0008000 之间）
